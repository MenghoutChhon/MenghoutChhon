version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khmer-ai-backend-prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - model_cache:/root/.cache
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: always
    networks:
      - khmer-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khmer-ai-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
    networks:
      - khmer-ai-network

volumes:
  model_cache:

networks:
  khmer-ai-network:
    driver: bridge
