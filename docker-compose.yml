version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khmer-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - khmer-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khmer-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - khmer-ai-network

volumes:
  model_cache:

networks:
  khmer-ai-network:
    driver: bridge
